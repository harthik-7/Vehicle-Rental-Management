<!DOCTYPE html>
<html>

<head>
    <title>Update Vehicle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>UPDATE VEHICLE</h1>

<img src="images/update-vehicle.svg" alt="Update Vehicle" class="page-image">

<nav>
    <a href="index.html">Home</a>
    <a href="list.html">List Vehicles</a>
    <a href="listOne.html">Search Vehicle</a>
    <a href="insert.html">Add Vehicle</a>
    <a href="update.html">Update Vehicle</a>
    <a href="delete.html">Delete Vehicle</a>
</nav>

<label>Select Vehicle ID</label>

<select id="vehicleid">
    <option value="">Select Vehicle ID</option>
</select>

<label>Vehicle Name</label>
<input type="text" id="vehiclename">

<label>Brand</label>
<input type="text" id="brand">

<label>Model</label>
<input type="text" id="model">

<label>Rent Per Day</label>
<input type="number" id="rentperday">

<label>Fuel Type</label>
<input type="text" id="fueltype">

<label>Availability</label>
<select id="availability">
    <option value="Available">Available</option>
    <option value="Not Available">Not Available</option>
</select>

<br>

<button onclick="updateVehicle()">
    Update Vehicle
</button>

<br><br>

<button onclick="location.href='index.html'">
    Home Page
</button>

<footer>
© 2026 Vehicle Rental System
</footer>

</div>

<script>

// Load Vehicle IDs
fetch("/vehicles")
.then(response=>response.json())
.then(data=>{

    let select=document.getElementById("vehicleid");

    data.forEach(vehicle=>{

        select.innerHTML += `
        <option value="${vehicle.vehicleid}">
            ${vehicle.vehicleid}
        </option>
        `;

    });

});

function updateVehicle()
{

let vehicleid=document.getElementById("vehicleid").value;
let vehiclename=document.getElementById("vehiclename").value;
let brand=document.getElementById("brand").value;
let model=document.getElementById("model").value;
let rentperday=document.getElementById("rentperday").value;
let fueltype=document.getElementById("fueltype").value;
let availability=document.getElementById("availability").value;

fetch("/vehicles/"+vehicleid,{

method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

vehiclename:vehiclename,
brand:brand,
model:model,
rentperday:rentperday,
fueltype:fueltype,
availability:availability

})

})

.then(response=>{

if(response.ok)
return response.text();

return response.text().then(message=>{
throw new Error(message);
});

})

.then(message=>{

alert(message);

location.href="index.html";

})

.catch(error=>{

alert(error.message);

});

}

</script>

</body>
</html>
