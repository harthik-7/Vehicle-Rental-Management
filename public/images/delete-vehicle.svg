<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="carNavy" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="carRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glowRedBadge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#dc2626" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Pill -->
  <rect x="10" y="10" width="300" height="140" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Warning Removal / De-Fleet Dashed Box in background -->
  <rect x="25" y="44" width="200" height="90" rx="10" fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Road & Speed Lines with warning dashes -->
  <path d="M 25 130 L 295 130" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M 45 138 L 275 138" stroke="#ef4444" stroke-width="2" stroke-dasharray="12 8" opacity="0.65"/>
  <path d="M 80 144 L 210 144" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Car Silhouette -->
  <g filter="url(#dropShadow)" transform="translate(-10, 0)">
    <!-- Main Car Body -->
    <path d="M 42 112 
             C 48 101, 62 96, 78 96 
             L 108 96 
             L 134 66 
             C 142 58, 156 56, 178 56 
             L 216 56 
             C 232 56, 246 66, 256 78 
             L 274 95 
             C 284 97, 290 104, 287 114 
             L 284 121 
             L 45 121 Z" 
          fill="url(#carNavy)"/>

    <!-- Roofline highlight -->
    <path d="M 134 66 C 142 58, 156 56, 178 56 L 216 56 C 228 56, 240 63, 248 72 L 244 74 C 238 67, 227 60, 215 60 L 178 60 C 160 60, 146 62, 138 68 Z" fill="url(#carRoof)" opacity="0.7"/>

    <!-- Windows with reflection -->
    <path d="M 137 70 L 174 70 L 174 92 L 112 92 Z" fill="url(#glassGrad)"/>
    <path d="M 181 70 L 219 70 C 228 70, 237 76, 244 86 L 248 92 L 181 92 Z" fill="url(#glassGrad)"/>
    <line x1="148" y1="72" x2="164" y2="90" stroke="#ffffff" stroke-width="2.5" opacity="0.55" stroke-linecap="round"/>
    <line x1="192" y1="72" x2="208" y2="90" stroke="#ffffff" stroke-width="2.5" opacity="0.55" stroke-linecap="round"/>

    <!-- Red-Orange Removal Accent Line -->
    <path d="M 45 107 L 284 107 L 282 112 L 45 112 Z" fill="url(#redGrad)"/>

    <!-- Headlight & Taillight -->
    <path d="M 276 97 L 286 100 L 282 107 L 273 105 Z" fill="#fca5a5"/>
    <circle cx="282" cy="103" r="2.5" fill="#ffffff"/>
    <path d="M 43 102 L 50 102 L 48 108 L 42 106 Z" fill="#ef4444"/>

    <!-- Door Handle -->
    <rect x="184" y="97" width="16" height="3" rx="1.5" fill="#64748b"/>

    <!-- Wheels -->
    <!-- Rear Wheel -->
    <circle cx="95" cy="121" r="18" fill="#0f172a" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="95" cy="121" r="11" fill="#475569"/>
    <line x1="95" y1="110" x2="95" y2="132" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="84" y1="121" x2="106" y2="121" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="95" cy="121" r="5" fill="#ef4444"/>
    <circle cx="95" cy="121" r="2" fill="#ffffff"/>

    <!-- Front Wheel -->
    <circle cx="236" cy="121" r="18" fill="#0f172a" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="236" cy="121" r="11" fill="#475569"/>
    <line x1="236" y1="110" x2="236" y2="132" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="225" y1="121" x2="247" y2="121" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="236" cy="121" r="5" fill="#ef4444"/>
    <circle cx="236" cy="121" r="2" fill="#ffffff"/>
  </g>

  <!-- Delete / Trash Badge -->
  <g transform="translate(202, 16)" filter="url(#glowRedBadge)">
    <!-- Outer Glow Ring -->
    <circle cx="30" cy="30" r="28" fill="url(#redGrad)"/>
    <circle cx="30" cy="30" r="25" fill="none" stroke="#ffffff" stroke-width="2.5"/>

    <!-- Trash Can Icon inside -->
    <g transform="translate(16, 15)">
      <!-- Lid -->
      <line x1="4" y1="9" x2="24" y2="9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 10 9 L 11 6 C 11 5, 12 4, 13 4 L 15 4 C 16 4, 17 5, 17 6 L 18 9" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Can Body -->
      <path d="M 6 11 L 8 26 C 8.2 27.5, 9.5 28.5, 11 28.5 L 17 28.5 C 18.5 28.5, 19.8 27.5, 20 26 L 22 11" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <!-- Inner Lines -->
      <line x1="11" y1="14" x2="11.5" y2="24" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="16.5" y1="14" x2="16" y2="24" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Mini "DELETE" Tag Ribbon -->
    <rect x="4" y="44" width="52" height="16" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="30" y="55.5" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">DELETE</text>
  </g>
</svg>
