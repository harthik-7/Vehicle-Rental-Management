<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="carNavy" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="carRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glowBadge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#ea580c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Pill -->
  <rect x="10" y="10" width="300" height="140" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Technical / Diagnostic Grid Lines in Background -->
  <path d="M 30 50 L 150 50 M 30 70 L 120 70" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  
  <!-- Tuning / Settings Sliders in Background -->
  <g transform="translate(30, 24)" opacity="0.75">
    <!-- Slider Track 1 -->
    <rect x="0" y="6" width="60" height="3" rx="1.5" fill="#cbd5e1"/>
    <rect x="0" y="6" width="38" height="3" rx="1.5" fill="url(#orangeGrad)"/>
    <circle cx="38" cy="7.5" r="4.5" fill="url(#orangeGrad)" stroke="#ffffff" stroke-width="1.5"/>
    
    <!-- Slider Track 2 -->
    <rect x="75" y="6" width="55" height="3" rx="1.5" fill="#cbd5e1"/>
    <rect x="75" y="6" width="28" height="3" rx="1.5" fill="url(#cyanGrad)"/>
    <circle cx="103" cy="7.5" r="4.5" fill="url(#cyanGrad)" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Service Ramp / Platform Lines -->
  <path d="M 25 130 L 295 130" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M 45 138 L 275 138" stroke="#f97316" stroke-width="2" stroke-dasharray="14 10" opacity="0.65"/>
  
  <!-- Diagnostic Base Pads under wheels -->
  <rect x="78" y="132" width="36" height="4" rx="2" fill="#94a3b8"/>
  <rect x="218" y="132" width="36" height="4" rx="2" fill="#94a3b8"/>

  <!-- Car Silhouette -->
  <g filter="url(#dropShadow)" transform="translate(-10, 0)">
    <!-- Main Car Body -->
    <path d="M 42 112 
             C 48 101, 62 96, 78 96 
             L 108 96 
             L 134 66 
             C 142 58, 156 56, 178 56 
             L 216 56 
             C 232 56, 246 66, 256 78 
             L 274 95 
             C 284 97, 290 104, 287 114 
             L 284 121 
             L 45 121 Z" 
          fill="url(#carNavy)"/>

    <!-- Roofline highlight -->
    <path d="M 134 66 C 142 58, 156 56, 178 56 L 216 56 C 228 56, 240 63, 248 72 L 244 74 C 238 67, 227 60, 215 60 L 178 60 C 160 60, 146 62, 138 68 Z" fill="url(#carRoof)" opacity="0.7"/>

    <!-- Windows with reflection -->
    <path d="M 137 70 L 174 70 L 174 92 L 112 92 Z" fill="url(#glassGrad)"/>
    <path d="M 181 70 L 219 70 C 228 70, 237 76, 244 86 L 248 92 L 181 92 Z" fill="url(#glassGrad)"/>
    <line x1="148" y1="72" x2="164" y2="90" stroke="#ffffff" stroke-width="2.5" opacity="0.55" stroke-linecap="round"/>
    <line x1="192" y1="72" x2="208" y2="90" stroke="#ffffff" stroke-width="2.5" opacity="0.55" stroke-linecap="round"/>

    <!-- Orange Trim / Accent Line -->
    <path d="M 45 107 L 284 107 L 282 112 L 45 112 Z" fill="url(#orangeGrad)"/>

    <!-- Headlight & Taillight -->
    <path d="M 276 97 L 286 100 L 282 107 L 273 105 Z" fill="#fde047"/>
    <circle cx="282" cy="103" r="2.5" fill="#ffffff"/>
    <path d="M 43 102 L 50 102 L 48 108 L 42 106 Z" fill="#ef4444"/>

    <!-- Door Handle -->
    <rect x="184" y="97" width="16" height="3" rx="1.5" fill="#64748b"/>

    <!-- Wheels -->
    <!-- Rear Wheel -->
    <circle cx="95" cy="121" r="18" fill="#0f172a" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="95" cy="121" r="11" fill="#475569"/>
    <line x1="95" y1="110" x2="95" y2="132" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="84" y1="121" x2="106" y2="121" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="95" cy="121" r="5" fill="#f97316"/>
    <circle cx="95" cy="121" r="2" fill="#ffffff"/>

    <!-- Front Wheel -->
    <circle cx="236" cy="121" r="18" fill="#0f172a" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="236" cy="121" r="11" fill="#475569"/>
    <line x1="236" y1="110" x2="236" y2="132" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="225" y1="121" x2="247" y2="121" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="236" cy="121" r="5" fill="#f97316"/>
    <circle cx="236" cy="121" r="2" fill="#ffffff"/>
  </g>

  <!-- Update / Wrench & Tool Badge -->
  <g transform="translate(202, 16)" filter="url(#glowBadge)">
    <!-- Outer Glow Ring -->
    <circle cx="30" cy="30" r="28" fill="url(#orangeGrad)"/>
    <circle cx="30" cy="30" r="25" fill="none" stroke="#ffffff" stroke-width="2.5"/>

    <!-- Crossed Tools / Wrench & Screwdriver -->
    <!-- Wrench (diagonal 1) -->
    <g transform="translate(14, 14)">
      <path d="M 28 4 C 23 4 19 7 17 11 L 22 16 L 19 19 L 14 14 C 10 16 7 20 7 25 C 7 28 8 30 10 32 L 23 19 L 26 22 L 13 35 C 15 37 18 38 21 38 C 26 38 30 35 32 31 L 27 26 L 30 23 L 35 28 C 39 26 42 22 42 17 C 42 9 35 4 28 4 Z" 
            fill="#ffffff" transform="scale(0.68)"/>
    </g>

    <!-- Mini "UPDATE" Tag Ribbon -->
    <rect x="4" y="44" width="52" height="16" rx="8" fill="#0f172a" stroke="#f97316" stroke-width="1.5"/>
    <text x="30" y="55.5" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">UPDATE</text>
  </g>
</svg>
