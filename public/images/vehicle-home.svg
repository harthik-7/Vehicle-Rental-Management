<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="carNavy" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Pill -->
  <rect x="10" y="10" width="300" height="140" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Speed / Road lines -->
  <path d="M 25 130 L 295 130" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M 50 138 L 270 138" stroke="#f97316" stroke-width="2" stroke-dasharray="16 10" opacity="0.6"/>

  <!-- Modern Sports / Rental Car Body -->
  <g filter="url(#dropShadow)">
    <!-- Car silhouette -->
    <path d="M 45 110 
             C 50 100, 65 95, 80 95 
             L 110 95 
             L 135 68 
             C 142 60, 155 58, 175 58 
             L 215 58 
             C 230 58, 245 68, 255 80 
             L 272 96 
             C 282 98, 288 105, 285 115 
             L 282 120 
             L 48 120 Z" 
          fill="url(#carNavy)"/>

    <!-- Car Windows -->
    <path d="M 138 72 L 175 72 L 175 92 L 115 92 Z" fill="#94a3b8" opacity="0.85"/>
    <path d="M 182 72 L 218 72 C 228 72, 238 78, 245 88 L 250 92 L 182 92 Z" fill="#cbd5e1" opacity="0.9"/>

    <!-- Orange Racing Stripe / Accent -->
    <path d="M 48 108 L 282 108 L 280 112 L 48 112 Z" fill="url(#orangeGrad)"/>

    <!-- Headlight & Taillight -->
    <path d="M 275 98 L 284 100 L 280 106 L 272 104 Z" fill="#f97316"/>
    <path d="M 46 102 L 52 102 L 50 108 L 45 106 Z" fill="#ef4444"/>

    <!-- Car Wheels -->
    <!-- Front Wheel -->
    <circle cx="235" cy="120" r="18" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <circle cx="235" cy="120" r="10" fill="#64748b"/>
    <circle cx="235" cy="120" r="5" fill="#f97316"/>

    <!-- Rear Wheel -->
    <circle cx="95" cy="120" r="18" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <circle cx="95" cy="120" r="10" fill="#64748b"/>
    <circle cx="95" cy="120" r="5" fill="#f97316"/>
  </g>

  <!-- Key / Rental Badge Icon -->
  <g transform="translate(185, 18)" filter="url(#dropShadow)">
    <circle cx="20" cy="20" r="18" fill="url(#orangeGrad)"/>
    <!-- Key Shape inside badge -->
    <circle cx="16" cy="16" r="6" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M 20 20 L 27 27 L 29 25 M 25 25 L 27 23" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
