<!DOCTYPE html>
<html>

<head>
    <title>Delete Vehicle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>DELETE VEHICLE</h1>

<img src="images/delete-vehicle.svg" alt="Delete Vehicle" class="page-image">

<nav>
    <a href="index.html">Home</a>
    <a href="list.html">List Vehicles</a>
    <a href="listOne.html">Search Vehicle</a>
    <a href="insert.html">Add Vehicle</a>
    <a href="update.html">Update Vehicle</a>
    <a href="delete.html">Delete Vehicle</a>
</nav>

<label>Select Vehicle ID</label>

<select id="vehicleid">
    <option value="">Select Vehicle ID</option>
</select>

<br><br>

<button onclick="deleteVehicle()">
    Delete Vehicle
</button>

<br><br>

<button onclick="location.href='index.html'">
    Home Page
</button>

<footer>
© 2026 Vehicle Rental System
</footer>

</div>

<script>

// Load Vehicle IDs
fetch("/vehicles")
.then(response => response.json())
.then(data => {

    let select = document.getElementById("vehicleid");

    data.forEach(vehicle => {

        select.innerHTML += `
        <option value="${vehicle.vehicleid}">
            ${vehicle.vehicleid}
        </option>
        `;

    });

});

function deleteVehicle()
{

    let vehicleid = document.getElementById("vehicleid").value;

    if(vehicleid=="")
    {
        alert("Please Select Vehicle ID");
        return;
    }

    if(confirm("Are you sure you want to delete this vehicle?")==false)
        return;

    fetch("/vehicles/" + vehicleid, {

        method:"DELETE"

    })

    .then(response => {

        if(response.ok)
            return response.text();

        return response.text().then(message => {
            throw new Error(message);
        });

    })

    .then(message => {

        alert(message);

        location.href="index.html";

    })

    .catch(error => {

        alert(error.message);

    });

}

</script>

</body>
</html>
